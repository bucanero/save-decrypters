name: Build Windows binaries

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  mingw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: win32
            cross: i686-w64-mingw32
          - arch: win64
            cross: x86_64-w64-mingw32
    name: MinGW ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v4

    - name: Install MinGW-w64 cross compiler and Wine
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get -y install mingw-w64 p7zip-full

    - name: Build binaries
      run: |
        ${{ matrix.cross }}-gcc --version
        make CC=${{ matrix.cross }}-gcc LDFLAGS=-static

    - name: Check binaries
      run: |
        # every tool must produce a .exe, and it must not depend on MinGW runtime DLLs
        for dir in $(find . -mindepth 2 -maxdepth 2 -name Makefile | xargs dirname | sort); do
          exe="$dir/$(basename $dir).exe"
          test -f "$exe" || { echo "::error::missing $exe"; exit 1; }
          if ${{ matrix.cross }}-objdump -p "$exe" | grep -iE "DLL Name: (libgcc|libwinpthread|libstdc)"; then
            echo "::error::$exe depends on MinGW runtime DLLs"; exit 1
          fi
        done
        file shnext-cheat-decrypter/shnext-cheat-decrypter.exe

    - name: Get short SHA
      run: echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Pack release
      run: |
        make release

    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ env.sha_name }}-${{ matrix.arch }}
        path: release.zip
